<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Am I?</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060f;--purple:#8b5cf6;--purple2:#6d28d9;
  --gold:#f59e0b;--gold2:#d97706;--cyan:#22d3ee;
  --text:#f1f5f9;--muted:#64748b;
  --card:rgba(139,92,246,0.07);--border:rgba(139,92,246,0.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh}
body{overflow-x:hidden}

/* BG STARS */
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:300;pointer-events:none}

/* HOME */
#home{position:relative;z-index:1;padding:2rem 2rem 4rem;min-height:100vh}
.home-title{font-family:'Orbitron',sans-serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:900;
  text-align:center;letter-spacing:.12em;margin-bottom:2.5rem;padding-top:.5rem;
  background:linear-gradient(135deg,#a78bfa,#f59e0b,#22d3ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 28px rgba(139,92,246,.7));animation:titlePulse 3s ease-in-out infinite}
@keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 28px rgba(139,92,246,.65))}
  50%{filter:drop-shadow(0 0 44px rgba(245,158,11,.8))}}

.rounds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem;max-width:1300px;margin:0 auto}

.round-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:1.3rem 1.4rem 1.1rem;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),border-color .25s,box-shadow .25s;
  display:flex;flex-direction:column;gap:.55rem}
.round-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--purple),var(--gold));transform:scaleX(0);
  transition:transform .3s;transform-origin:left}
.round-card:hover{transform:translateY(-6px);border-color:var(--purple);
  box-shadow:0 12px 36px rgba(139,92,246,.3)}
.round-card:hover::before{transform:scaleX(1)}
.round-card:active{transform:scale(.97)}

.rc-top{display:flex;align-items:center;justify-content:space-between}
.rc-num{font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;
  background:linear-gradient(135deg,#a78bfa,#f59e0b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.rc-badge{background:rgba(139,92,246,.2);color:var(--purple);font-size:.68rem;
  font-weight:700;padding:.25rem .6rem;border-radius:999px;letter-spacing:.05em;border:1px solid rgba(139,92,246,.3)}

.rc-middle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 0}
.rc-mystery{font-size:2.2rem;opacity:.18}
.rc-tagline{font-size:.78rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

.rc-play{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  margin-top:.4rem;padding:.55rem;border-radius:10px;
  background:linear-gradient(135deg,var(--purple2),var(--purple));
  color:#fff;font-weight:700;font-size:.85rem;font-family:'Poppins',sans-serif;
  border:none;cursor:pointer;transition:all .2s;letter-spacing:.04em}
.rc-play:hover{box-shadow:0 4px 18px rgba(139,92,246,.5);transform:translateY(-1px)}

/* OVERLAY (game + answer) */
#overlay{position:fixed;inset:0;z-index:100;display:none;
  background:radial-gradient(ellipse at 50% 20%,#0d0622 0%,#06060f 70%)}
#overlay.open{display:flex;flex-direction:column}

/* GAME PAGE */
#gamePage{flex:1;display:flex;flex-direction:column;padding:1.5rem 2rem;gap:1rem;overflow:hidden}
.game-header{display:flex;align-items:center;gap:1rem}
.back-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:var(--muted);padding:.45rem .9rem;border-radius:8px;cursor:pointer;
  font-size:.82rem;font-family:'Poppins',sans-serif;transition:all .2s;white-space:nowrap}
.back-btn:hover{background:rgba(139,92,246,.18);border-color:var(--purple);color:var(--text)}
.game-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:900;
  letter-spacing:.18em;background:linear-gradient(90deg,#a78bfa,#22d3ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 14px rgba(139,92,246,.6))}

.clue-dots{display:flex;gap:.5rem;align-items:center}
.cdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12);transition:all .35s}
.cdot.done{background:var(--purple);box-shadow:0 0 8px var(--purple)}
.cdot.cur{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.35)}
.clue-label{font-size:.8rem;color:var(--muted);margin-left:.3rem}

.clues-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.7rem;
  padding:.5rem 0;scrollbar-width:thin;scrollbar-color:var(--purple) transparent}
.clues-wrap::-webkit-scrollbar{width:4px}
.clues-wrap::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px}

.clue-item{display:flex;gap:.9rem;align-items:flex-start;
  background:var(--card);border:1px solid var(--border);border-radius:13px;
  padding:.9rem 1.2rem;position:relative;overflow:hidden;
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) both}
.clue-item::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--purple),var(--cyan));border-radius:2px 0 0 2px}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.clue-n{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--purple);
  min-width:24px;padding-top:.15rem;font-weight:700}
.clue-t{font-size:clamp(1rem,1.8vw,1.2rem);line-height:1.6;font-weight:500}

.game-btns{display:flex;gap:.9rem;padding-top:.5rem;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.8rem 1.8rem;border-radius:12px;font-family:'Poppins',sans-serif;
  font-size:.95rem;font-weight:700;cursor:pointer;border:none;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);letter-spacing:.04em}
.btn:active{transform:scale(.95)}
.btn-reveal{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);
  color:var(--gold);font-size:.82rem;padding:.6rem 1.2rem;white-space:nowrap}
.btn-reveal:hover{background:rgba(245,158,11,.22);border-color:var(--gold)}
.btn-next{background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;
  flex:1;font-size:1.05rem;box-shadow:0 4px 18px rgba(139,92,246,.4);
  animation:nextPulse 2.2s ease-in-out infinite}
.btn-next:hover{box-shadow:0 6px 28px rgba(139,92,246,.6);transform:translateY(-2px)}
.btn-next:disabled{opacity:.3;cursor:not-allowed;animation:none;transform:none;box-shadow:none}
@keyframes nextPulse{0%,100%{box-shadow:0 4px 18px rgba(139,92,246,.35)}
  50%{box-shadow:0 4px 32px rgba(139,92,246,.7)}}

/* ANSWER PAGE */
#answerPage{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem;gap:1.5rem;position:relative;overflow:hidden}
#answerPage.show{display:flex}

.ans-label{font-size:clamp(.8rem,1.5vw,1rem);color:var(--muted);
  letter-spacing:.3em;text-transform:uppercase}

.ans-photo-wrap{width:180px;height:180px;border-radius:50%;overflow:hidden;
  border:4px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,
             linear-gradient(135deg,#a78bfa,#f59e0b,#22d3ee) border-box;
  box-shadow:0 0 40px rgba(139,92,246,.5);flex-shrink:0;
  animation:photoIn .6s cubic-bezier(.34,1.56,.64,1) both .1s;position:relative}
@keyframes photoIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.ans-photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:top}
.photo-spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(13,6,34,.8)}
.spinner{width:36px;height:36px;border:3px solid rgba(139,92,246,.3);
  border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ans-photo-initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-size:2.5rem;font-weight:900;
  background:linear-gradient(135deg,var(--purple2),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.ans-word{font-family:'Orbitron',sans-serif;font-size:clamp(2rem,6vw,5rem);font-weight:900;
  text-align:center;letter-spacing:.06em;
  background:linear-gradient(135deg,#f59e0b,#ef4444,#8b5cf6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:ansIn .7s cubic-bezier(.34,1.56,.64,1) both,ansGlow 2s ease-in-out .7s infinite}
@keyframes ansIn{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes ansGlow{0%,100%{filter:drop-shadow(0 0 18px rgba(245,158,11,.5))}
  50%{filter:drop-shadow(0 0 48px rgba(239,68,68,.8))}}

.ans-recap{display:flex;flex-direction:column;gap:.5rem;max-width:660px;width:100%;text-align:left;max-height:38vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--purple) transparent}
.ans-recap::-webkit-scrollbar{width:3px}
.ans-recap::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px}
.ans-recap-item{border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);overflow:hidden}
.arc-clue{font-size:.82rem;color:var(--text);opacity:.8;padding:.4rem .8rem .2rem;line-height:1.5;display:flex;gap:.5rem}
.arc-cn{font-family:'Orbitron',sans-serif;font-size:.62rem;color:var(--purple);min-width:20px;padding-top:.1rem;font-weight:700;flex-shrink:0}
.arc-explain{font-size:.78rem;color:var(--gold);padding:.2rem .8rem .45rem 2.1rem;line-height:1.5;opacity:.85}

.ans-btns{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center}
.btn-home{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  color:var(--muted);padding:.75rem 1.6rem;border-radius:12px;cursor:pointer;
  font-family:'Poppins',sans-serif;font-size:.9rem;font-weight:600;transition:all .2s}
.btn-home:hover{background:rgba(255,255,255,.12);color:var(--text)}
.btn-nxt{background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;
  padding:.75rem 1.8rem;border-radius:12px;cursor:pointer;
  font-family:'Poppins',sans-serif;font-size:.95rem;font-weight:700;border:none;
  box-shadow:0 4px 18px rgba(139,92,246,.4);transition:all .25s}
.btn-nxt:hover{box-shadow:0 6px 28px rgba(139,92,246,.6);transform:translateY(-2px)}

/* FLASH */
#flash{position:fixed;inset:0;z-index:400;background:#fff;opacity:0;pointer-events:none;transition:opacity .08s}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>
<div id="flash"></div>

<!-- HOME -->
<div id="home">
  <div class="home-title">WHO AM I?</div>
  <div class="rounds-grid" id="roundsGrid"></div>
</div>

<!-- OVERLAY -->
<div id="overlay">

  <div id="gamePage">
    <div class="game-header">

      <div class="game-title">WHO AM I?</div>

    <div class="clue-dots" id="clueDots"></div>
    <div class="clues-wrap" id="cluesWrap"></div>
    <div class="game-btns">
      <button class="btn btn-reveal" onclick="showAnswer()">🎭 Reveal</button>
      <button class="btn btn-next" id="nextBtn" onclick="nextClue()">Next Clue ›</button>
    </div>
  </div>

  <!-- ANSWER -->
  <div id="answerPage">
    <div class="ans-label">The answer is…</div>
    <div class="ans-photo-wrap" id="photoWrap">
      <div class="photo-spinner" id="photoSpinner"><div class="spinner"></div></div>
    </div>
    <div class="ans-word" id="ansWord"></div>
    <div class="ans-recap" id="ansRecap"></div>
    <div class="ans-btns">
      <button class="btn-home" onclick="closeOverlay()">← All Rounds</button>
      <button class="btn-nxt" id="nextRoundBtn" onclick="nextRound()">Next Round →</button>
    </div>
  </div>
</div>

/* ── STATE ── */
let cur = null, revealed = 0, curIdx = 0;

/* ── PARTICLES ── */
(function(){
  const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize(); window.addEventListener('resize',resize);
  for(let i=0;i<100;i++) pts.push({x:Math.random()*3000,y:Math.random()*2000,r:Math.random()*1.6+.3,dx:(Math.random()-.5)*.25,dy:(Math.random()-.5)*.25,a:Math.random()*.5+.1});
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(139,92,246,${p.a})`;ctx.fill();});
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── CONFETTI ── */
const cfc=document.getElementById('confettiCanvas'),cfx=cfc.getContext('2d');
cfc.width=window.innerWidth;cfc.height=window.innerHeight;
window.addEventListener('resize',()=>{cfc.width=window.innerWidth;cfc.height=window.innerHeight;});
const COLS=['#8b5cf6','#f59e0b','#22d3ee','#10b981','#ef4444','#f97316','#ec4899'];
let pieces=[],cfActive=false;
function launchConfetti(){
  pieces=[];
  for(let i=0;i<220;i++) pieces.push({x:Math.random()*cfc.width,y:-20-Math.random()*150,w:5+Math.random()*8,h:7+Math.random()*10,color:COLS[Math.floor(Math.random()*COLS.length)],rot:Math.random()*360,rs:(Math.random()-.5)*9,dy:2.5+Math.random()*4,dx:(Math.random()-.5)*2,a:1});
  cfActive=true;animateCf();
}
function animateCf(){
  if(!cfActive)return;
  cfx.clearRect(0,0,cfc.width,cfc.height);
  let alive=0;
  pieces.forEach(p=>{p.y+=p.dy;p.x+=p.dx;p.rot+=p.rs;if(p.y>cfc.height)p.a-=.04;
    if(p.a>0){alive++;cfx.save();cfx.globalAlpha=p.a;cfx.translate(p.x+p.w/2,p.y+p.h/2);cfx.rotate(p.rot*Math.PI/180);cfx.fillStyle=p.color;cfx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cfx.restore();}});
  if(alive>0)requestAnimationFrame(animateCf);
  else{cfActive=false;cfx.clearRect(0,0,cfc.width,cfc.height);}
}

/* ── FLASH ── */
function flash(){const f=document.getElementById('flash');f.style.opacity='.5';setTimeout(()=>f.style.opacity='0',100);}

/* ── RENDER HOME ── */
function renderHome(){
  const grid=document.getElementById('roundsGrid');
  grid.innerHTML=ALL_ROUNDS.map(r=>`
    <div class="round-card" onclick="startRound(${r.n-1})">
      <div class="rc-top">
        <div class="rc-num">${r.n}</div>
        <div class="rc-badge">${r.clues.length} clue${r.clues.length!==1?'s':''}</div>
      </div>
      <div class="rc-middle">
        <div class="rc-mystery">❓</div>
        <div class="rc-tagline">Who am I?</div>
      </div>
      <button class="rc-play" onclick="startRound(${r.n-1});event.stopPropagation()">▶ Play</button>
    </div>`).join('');
}

/* ── START ROUND ── */
function startRound(idx){
  curIdx=idx;
  cur=ALL_ROUNDS[idx];
  revealed=0;
  document.getElementById('cluesWrap').innerHTML='';
  renderDots();
  updateNextBtn();
  document.getElementById('gamePage').style.display='flex';
  document.getElementById('answerPage').style.display='none';
  document.getElementById('answerPage').classList.remove('show');
  document.getElementById('overlay').classList.add('open');
  flash();
  // Show first clue automatically
  revealOneClue();
}

function closeOverlay(){
  document.getElementById('overlay').classList.remove('open');
  cfActive=false; cfx.clearRect(0,0,cfc.width,cfc.height);
}

function nextRound(){
  const next=curIdx+1;
  if(next<ALL_ROUNDS.length){ cfActive=false; cfx.clearRect(0,0,cfc.width,cfc.height); startRound(next); }
  else closeOverlay();
}

/* ── DOTS ── */
function renderDots(){
  const total=cur.clues.length;
  let h='';
  for(let i=0;i<total;i++){
    let cls='cdot';
    if(i<revealed)cls+=' done';
    if(i===revealed-1)cls+=' cur';
    h+=`<div class="${cls}"></div>`;
  }
  h+=`<span class="clue-label">${revealed}/${total}</span>`;
  document.getElementById('clueDots').innerHTML=h;
}

/* ── CLUE REVEAL ── */
function revealOneClue(){
  if(revealed>=cur.clues.length)return;
  const wrap=document.getElementById('cluesWrap');
  const d=document.createElement('div');
  d.className='clue-item';
  d.innerHTML=`<div class="clue-n">C${revealed+1}</div><div class="clue-t">${cur.clues[revealed]}</div>`;
  wrap.appendChild(d);
  d.scrollIntoView({behavior:'smooth',block:'nearest'});
  revealed++;
  renderDots();
  updateNextBtn();
}

function nextClue(){flash();revealOneClue();}

function updateNextBtn(){
  const btn=document.getElementById('nextBtn');
  const done=revealed>=cur.clues.length;
  btn.disabled=done;
  btn.textContent=done?'All clues shown':'Next Clue ›';
}

/* ── ANSWER ── */
async function showAnswer(){
  flash();
  document.getElementById('gamePage').style.display='none';
  const ap=document.getElementById('answerPage');
  ap.style.display='flex';
  ap.classList.add('show');

  // Set answer text
  document.getElementById('ansWord').textContent=cur.answer;

  // Recap with explanations
  const shown=cur.clues.slice(0,revealed);
  document.getElementById('ansRecap').innerHTML=shown.map((c,i)=>`
    <div class="ans-recap-item">
      <div class="arc-clue"><span class="arc-cn">C${i+1}</span>${c}</div>
      ${cur.explains&&cur.explains[i]?`<div class="arc-explain">💡 ${cur.explains[i]}</div>`:''}
    </div>`).join('');

  // Photo
  const wrap=document.getElementById('photoWrap');
  const spinner=document.getElementById('photoSpinner');
  // Clear old image
  const oldImg=wrap.querySelector('img');
  const oldInit=wrap.querySelector('.ans-photo-initials');
  if(oldImg)oldImg.remove();
  if(oldInit)oldInit.remove();
  spinner.style.display='flex';

  const photo=await fetchWikiPhoto(cur.wikiName||cur.answer);
  spinner.style.display='none';
  if(photo){
    const img=document.createElement('img');
    img.src=photo;
    img.alt=cur.answer;
    img.onerror=()=>{img.remove();showInitials(wrap,cur.answer);};
    wrap.appendChild(img);
  } else {
    showInitials(wrap,cur.answer);
  }

  const nrBtn=document.getElementById('nextRoundBtn');
  if(nrBtn){ nrBtn.textContent=curIdx+1<ALL_ROUNDS.length?'Next Round →':'Finish'; }
  setTimeout(launchConfetti,300);
}

function showInitials(wrap,name){
  const d=document.createElement('div');
  d.className='ans-photo-initials';
  d.textContent=name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  wrap.appendChild(d);
}

async function fetchWikiPhoto(name){
  try{
    const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
    if(!r.ok)return null;
    const d=await r.json();
    return d.thumbnail?.source||null;
  }catch(e){return null;}
}

/* ── INIT ── */
renderHome();
</script>
